name: 'Repro-in-a-Box Scan'
description: 'Scan a URL for bugs and upload HTML/Markdown reports as CI artifacts'
author: 'forbiddenlink'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  url:
    description: 'URL to scan'
    required: true
  max-pages:
    description: 'Maximum pages to crawl'
    required: false
    default: '10'
  max-depth:
    description: 'Maximum crawl depth'
    required: false
    default: '2'
  format:
    description: 'Human report format: html or markdown (JSON results always written)'
    required: false
    default: 'html'
  fail-on:
    description: 'Fail the job when an issue at or above this severity is found: none, info, warning, error, critical'
    required: false
    default: 'none'
  fail-on-issues:
    description: 'Deprecated shorthand: true behaves like fail-on: info when fail-on is none'
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Post the markdown report as a pull request comment (use format: markdown)'
    required: false
    default: 'false'
  output-dir:
    description: 'Directory for report artifacts'
    required: false
    default: 'repro-results'

outputs:
  report-path:
    description: 'Path to the human-readable report (html or markdown)'
    value: ${{ steps.scan.outputs.report-path }}
  json-path:
    description: 'Path to the JSON scan results'
    value: ${{ steps.scan.outputs.json-path }}
  issue-count:
    description: 'Total issues found'
    value: ${{ steps.scan.outputs.issue-count }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 10.34.6

    - name: Install and build Repro-in-a-Box
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        pnpm install --frozen-lockfile
        pnpm run build
        pnpm exec playwright install chromium --with-deps

    - name: Run scan
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPRO_URL: ${{ inputs.url }}
        REPRO_MAX_PAGES: ${{ inputs.max-pages }}
        REPRO_MAX_DEPTH: ${{ inputs.max-depth }}
        REPRO_FORMAT: ${{ inputs.format }}
        REPRO_OUT_DIR: ${{ inputs.output-dir }}
        REPRO_FAIL_ON: ${{ inputs.fail-on }}
        REPRO_FAIL: ${{ inputs.fail-on-issues }}
      run: |
        set -euo pipefail
        mkdir -p "$REPRO_OUT_DIR"

        JSON_PATH="$REPRO_OUT_DIR/scan-results.json"
        case "$REPRO_FORMAT" in
          markdown|md)
            REPORT_PATH="$REPRO_OUT_DIR/scan-report.md"
            FORMAT="markdown"
            ;;
          *)
            REPORT_PATH="$REPRO_OUT_DIR/scan-report.html"
            FORMAT="html"
            ;;
        esac

        FAIL_ON="$REPRO_FAIL_ON"
        if [[ "$FAIL_ON" == "none" && "$REPRO_FAIL" == "true" ]]; then
          FAIL_ON="info"
        fi

        # Capture the exit code instead of letting set -e abort: the report, outputs and
        # artifact upload must happen even when the scan trips the --fail-on threshold.
        SCAN_EXIT=0
        node "$ACTION_PATH/dist/cli/index.js" scan "$REPRO_URL" \
          --max-pages "$REPRO_MAX_PAGES" \
          --max-depth "$REPRO_MAX_DEPTH" \
          --format json \
          --output "$JSON_PATH" \
          --fail-on "$FAIL_ON" || SCAN_EXIT=$?

        # Exit 1 is the threshold signal only when results were written; anything else is a real failure.
        if [[ "$SCAN_EXIT" != "0" && ! -s "$JSON_PATH" ]]; then
          echo "Scan failed before producing results (exit $SCAN_EXIT)" >&2
          exit "$SCAN_EXIT"
        fi

        ACTION_PATH="$ACTION_PATH" JSON_PATH="$JSON_PATH" REPORT_PATH="$REPORT_PATH" FORMAT="$FORMAT" \
        node --input-type=module <<'EOF'
        import { readFileSync } from 'fs';
        import { pathToFileURL } from 'url';
        const actionPath = process.env.ACTION_PATH;
        const htmlMod = await import(pathToFileURL(`${actionPath}/dist/reporters/html-reporter.js`).href);
        const mdMod = await import(pathToFileURL(`${actionPath}/dist/reporters/markdown-reporter.js`).href);
        const results = JSON.parse(readFileSync(process.env.JSON_PATH, 'utf8'));
        if (process.env.FORMAT === 'markdown') {
          mdMod.generateMarkdownReport(results, process.env.REPORT_PATH);
        } else {
          htmlMod.generateHtmlReport(results, process.env.REPORT_PATH);
        }
        EOF

        ISSUE_COUNT=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(String(r.summary?.totalIssues ?? 0))" "$JSON_PATH")

        echo "report-path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
        echo "json-path=$JSON_PATH" >> "$GITHUB_OUTPUT"
        echo "issue-count=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"
        echo "Report: $REPORT_PATH · Issues: $ISSUE_COUNT"

        if [[ "$SCAN_EXIT" != "0" ]]; then
          echo "Failing: issues at or above severity '$FAIL_ON' were found (total issues: $ISSUE_COUNT)" >&2
          exit "$SCAN_EXIT"
        fi

    - name: Comment markdown report on PR
      if: ${{ always() && steps.scan.outputs.report-path != '' && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPORT_PATH: ${{ steps.scan.outputs.report-path }}
        ISSUE_COUNT: ${{ steps.scan.outputs.issue-count }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ ! "$REPORT_PATH" =~ \.md$ ]]; then
          echo "comment-on-pr requires format: markdown (got $REPORT_PATH)" >&2
          exit 1
        fi
        {
          echo "## Repro-in-a-Box scan"
          echo
          echo "Issues found: $ISSUE_COUNT"
          echo
          cat "$REPORT_PATH"
        } > /tmp/repro-pr-comment.md
        gh pr comment "$PR_NUMBER" --body-file /tmp/repro-pr-comment.md

    - name: Upload report artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: repro-scan-report
        path: |
          ${{ steps.scan.outputs.report-path }}
          ${{ steps.scan.outputs.json-path }}
        if-no-files-found: warn
